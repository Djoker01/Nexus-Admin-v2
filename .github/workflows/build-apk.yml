name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la APK'
        required: true
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'
      
      - name: Instalar dependencias
        run: |
          npm install
          npm install -g @capacitor/cli
      
      - name: Eliminar carpeta android si existe
        run: |
          if [ -d "android" ]; then
            echo "Eliminando carpeta android existente..."
            rm -rf android
          fi
      
      - name: Crear estructura de recursos
        run: |
          mkdir -p www/icons
          mkdir -p www/css
          mkdir -p www/js/modules
          mkdir -p www/lib
      
      - name: Generar íconos básicos
        run: |
          # Crear íconos simples usando Node.js
          node << 'EOF'
          const fs = require('fs');
          const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
          
          sizes.forEach(size => {
              // Crear un SVG simple y guardarlo como referencia
              const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
                  <rect width="${size}" height="${size}" rx="${size/8}" fill="#111827"/>
                  <text x="${size/2}" y="${size/2}" text-anchor="middle" dy=".3em" 
                      font-family="Arial" font-weight="bold" font-size="${size/2}" fill="white">N</text>
              </svg>`;
              fs.writeFileSync(`www/icons/icon-${size}x${size}.svg`, svg);
          });
          
          console.log('✅ Íconos SVG generados');
          EOF
      
      - name: Agregar plataforma Android
        run: |
          npx cap add android
      
      - name: Sincronizar proyecto web con Android
        run: |
          npx cap sync android
      
      - name: Verificar estructura
        run: |
          echo "=== Estructura del proyecto ==="
          ls -la
          echo "=== Contenido de www ==="
          ls -la www/
          echo "=== Estructura de Android ==="
          ls -la android/
          echo "=== Gradle files ==="
          ls -la android/app/
      
      - name: Dar permisos a Gradle
        run: |
          cd android
          chmod +x gradlew
      
      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug
      
      - name: Verificar APK generada
        run: |
          echo "=== Buscando APKs ==="
          find android -name "*.apk" -type f
          echo "=== Tamaño de APKs ==="
          find android -name "*.apk" -type f -exec ls -lh {} \;
      
      - name: Crear carpeta de salida
        run: |
          mkdir -p output
      
      - name: Copiar APK Debug
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/nexus-admin-debug.apk
            echo "✅ APK Debug copiada"
          else
            echo "⚠️ APK Debug no encontrada, buscando..."
            find android -name "*.apk" -exec cp {} output/nexus-admin-debug.apk \;
          fi
      
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexus-admin-apk
          path: output/*.apk
      
      - name: Crear Release (opcional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: Nexus Admin v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## 📱 Nexus Admin APK
            
            - **Versión:** ${{ github.event.inputs.version || '1.0.0' }}
            - **Build:** #${{ github.run_number }}
            - **Fecha:** $(date +%Y-%m-%d)
            
            ### 📥 Instalación:
            1. Descarga el archivo APK
            2. Permite "Fuentes desconocidas" en tu Android
            3. Instala la APK
            
            ### 📦 Módulos incluidos:
            - Dashboard con KPIs
            - Inventario
            - Ventas
            - Caja
            - Gastos
            - Cuentas por Cobrar
            - Mermas y Consumo
            - Reabastecimiento
            - Análisis de Proveedores
            - Reportes
            - Respaldos
          files: |
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
