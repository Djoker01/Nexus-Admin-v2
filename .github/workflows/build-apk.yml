name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la APK'
        required: true
        default: '1.0.0'

# AGREGAR ESTOS PERMISOS
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'
      
      - name: Verificar estructura del proyecto
        run: |
          echo "=== Archivos en la raíz ==="
          ls -la
          echo "=== Archivos en www ==="
          ls -la www/ || echo "⚠️ Carpeta www NO EXISTE"
      
      - name: Crear carpeta www si no existe
        run: |
          if [ ! -d "www" ]; then
            echo "Creando carpeta www..."
            mkdir -p www
          fi
      
      - name: Mover archivos a www si están en raíz
        run: |
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            echo "Moviendo archivos a www..."
            cp -r index.html www/ 2>/dev/null || true
            cp -r manifest.json www/ 2>/dev/null || true
            cp -r sw.js www/ 2>/dev/null || true
            cp -r css www/ 2>/dev/null || true
            cp -r js www/ 2>/dev/null || true
            cp -r lib www/ 2>/dev/null || true
            cp -r icons www/ 2>/dev/null || true
          fi
          echo "=== Contenido final de www ==="
          ls -la www/
      
      - name: Instalar dependencias
        run: |
          npm install
          npm install -g @capacitor/cli
      
      - name: Eliminar android si existe
        run: rm -rf android
      
      - name: Agregar plataforma Android
        run: npx cap add android
      
      - name: Sincronizar proyecto web
        run: npx cap sync android
      
      - name: Dar permisos a Gradle
        run: |
          cd android
          chmod +x gradlew
      
      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug
      
      - name: Copiar APK
        run: |
          mkdir -p output
          find android -name "*.apk" -exec cp {} output/nexus-admin.apk \;
          ls -la output/
      
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexus-admin-apk
          path: output/*.apk
      
      - name: Crear Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: Nexus Admin v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## 📱 Nexus Admin APK
            **Versión:** ${{ github.event.inputs.version || '1.0.0' }}
            **Build:** #${{ github.run_number }}
            
            ### 📥 Para instalar:
            1. Descarga el archivo `nexus-admin.apk`
            2. Permite "Fuentes desconocidas" en Android
            3. Instala y abre la app
          files: |
            output/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
